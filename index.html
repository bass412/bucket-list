<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8f2">
  <meta name="description" content="Bass 的人生清单：把期待的事情，慢慢写进生活。">
  <title>人生清单 · Bass</title>
  <style>
    :root{color-scheme:light;--ink:#253e34;--muted:#758277;--green:#537e64;--paper:#fafbf6;--line:#e3e9de;--sage:#e7efe4;--serif:Georgia,"Songti SC","SimSun",serif}
    *{box-sizing:border-box}
    body{margin:0;background:#f5f7f0;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:15px;line-height:1.6}
    button,a{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #83a58d;outline-offset:3px}
    .wrap{max-width:1160px;margin:auto;padding:0 36px}
    header{border-bottom:1px solid #e5ebe0;background:rgba(250,251,246,.9)}
    .nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.12em;font-weight:700}
    .brand-icon{display:grid;place-items:center;width:36px;height:36px;border:1px solid #cbddca;border-radius:50%;font-size:18px}
    .nav-note{color:var(--muted);font-size:12px;letter-spacing:.08em}
    .hero{position:relative;overflow:hidden;padding:80px 0 68px;background:radial-gradient(ellipse at 84% 35%,#e8f0e3 0,transparent 43%),linear-gradient(135deg,#fbfcf8,#f3f7ed)}
    .hero-grid{display:grid;grid-template-columns:1fr 340px;gap:50px;align-items:center}
    .eyebrow{font-size:11px;letter-spacing:.25em;color:#789781;font-weight:700}
    h1{font-family:var(--serif);font-weight:400;font-size:clamp(48px,7vw,78px);line-height:1.17;letter-spacing:.06em;margin:23px 0 20px}
    h1 span{color:#72937b}
    .lead{max-width:480px;color:#66786b;font-size:15px;line-height:2;margin:0}
    .hero-foot{display:flex;align-items:center;gap:10px;margin-top:30px;font-size:12px;color:#829083;letter-spacing:.08em}
    .hero-foot:before{content:"";width:32px;height:1px;background:#a7bca9}
    .note{position:relative;min-height:256px;background:#fffef9;border:1px solid #e4eadc;border-radius:12px;padding:30px;box-shadow:0 18px 45px #6d866316;transform:rotate(2deg)}
    .note:before{content:"";position:absolute;top:-11px;left:43%;width:64px;height:22px;background:#dce9d6b5;transform:rotate(-3deg)}
    .note-top{display:flex;justify-content:space-between;color:#9baa9b;font-size:10px;letter-spacing:.18em}
    .note-mark{font-family:var(--serif);font-size:48px;color:#b6cbb5;line-height:1;margin-top:23px}
    .note p{font-family:var(--serif);font-size:18px;line-height:1.9;margin:0;color:#637c69}
    .note-bottom{margin-top:24px;color:#a6b5a4;font-size:11px;letter-spacing:.12em}
    main{padding:48px 0 80px}
    .summary{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px 28px;display:flex;align-items:center;gap:28px;box-shadow:0 8px 30px #4a634609}
    .summary-title{font-size:13px;color:#6b7d6e;min-width:160px}.summary-title strong{display:block;font-size:18px;font-weight:600;color:var(--ink)}
    .progress-wrap{flex:1}.progress-label{display:flex;justify-content:space-between;gap:14px;font-size:12px;color:var(--muted);margin-bottom:9px}
    .track{height:7px;border-radius:20px;background:#e6ece3;overflow:hidden}.bar{height:100%;width:0;background:#8bac90;border-radius:20px;transition:width .25s}
    .count{font-family:var(--serif);font-size:32px;color:#6d9575;white-space:nowrap}.count small{font-family:sans-serif;font-size:12px;color:#9ba99a}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:58px 0 22px}
    .section-kicker{font-size:10px;letter-spacing:.2em;color:#92a995;font-weight:700}
    h2{font-family:var(--serif);font-size:32px;font-weight:400;letter-spacing:.06em;margin:5px 0 0}
    .section-text{font-size:13px;color:#9aa89a;margin:0}
    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:25px}
    .filter{padding:8px 16px;border:1px solid #e2e9dd;border-radius:99px;color:#738476;background:#fbfcf8;cursor:pointer;font-size:12px}
    .filter[aria-pressed=true]{background:#63896c;border-color:#63896c;color:white}
    .list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .card,.empty,.error{background:#fffefa;border:1px solid #e8eee2;border-radius:14px;box-shadow:0 8px 25px #5e785207}
    .card{padding:24px;min-height:160px;display:flex;flex-direction:column;gap:14px}
    .card-top{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#93a493}
    .badge{background:#edf3e9;border-radius:20px;padding:4px 10px;color:#718d75}
    .card h3{font-family:var(--serif);font-size:20px;font-weight:400;line-height:1.5;margin:0}
    .card-status{margin-top:auto;color:#91a395;font-size:12px}.card-status.done{color:#63896c}
    .empty,.error{grid-column:1/-1;min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:34px}
    .empty-icon{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:#eff5e9;color:#8baa8d;font-size:25px}
    .empty h3,.error h3{font-family:var(--serif);font-weight:400;font-size:23px;margin:20px 0 6px}
    .empty p,.error p{color:#9aa99a;font-size:13px;margin:0;line-height:2}
    footer{border-top:1px solid var(--line);padding:28px 0;color:#9aa99a;font-size:12px}
    .footer-inner{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
    footer a{color:#718e77;text-decoration:none}footer a:hover{text-decoration:underline}
    @media(max-width:700px){.wrap{padding:0 22px}.nav{height:66px}.nav-note{font-size:10px}.hero{padding:56px 0 48px}.hero-grid{grid-template-columns:1fr;gap:36px}.note{min-height:0;padding:25px}.note-mark{margin-top:15px}.note p{font-size:16px}.summary{padding:20px;gap:18px;flex-wrap:wrap}.summary-title{min-width:0;flex:1}.progress-wrap{order:3;flex-basis:100%}.section-head{margin-top:43px;align-items:start;flex-direction:column;gap:4px}.list{grid-template-columns:1fr}.card{min-height:130px}}
  </style>
</head>
<body>
  <header><div class="wrap nav"><div class="brand"><span class="brand-icon" aria-hidden="true">✿</span><span>BASS / 人生清单</span></div><span class="nav-note">A LITTLE LIFE JOURNAL</span></div></header>
  <section class="hero"><div class="wrap hero-grid">
    <div><div class="eyebrow">A LIST FOR THE LIFE I WANT</div><h1>人生<span>清单</span></h1><p class="lead">把期待的事情，慢慢写进生活。<br>去尝试，去感受，也给未知留一点空间。</p><div class="hero-foot">一件一件，向喜欢的生活靠近</div></div>
    <aside class="note" aria-label="清单寄语"><div class="note-top"><span>NOTE TO MYSELF</span><span>✧</span></div><div class="note-mark" aria-hidden="true">“</div><p>想做的事，<br>别总说「以后」。</p><div class="note-bottom">SOME DAY → TODAY</div></aside>
  </div></section>
  <main class="wrap">
    <section class="summary" aria-label="清单进度">
      <div class="summary-title"><strong>慢慢完成</strong><span>每一步都值得记录</span></div>
      <div class="progress-wrap"><div class="progress-label"><span>已完成 / 已添加</span><span id="ratio">0 / 0</span></div><div class="track" role="progressbar" aria-label="清单完成进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="bar"></div></div></div>
      <div class="count"><span id="done">0</span> <small>件已完成</small></div>
    </section>
    <section aria-labelledby="list-title">
      <div class="section-head"><div><div class="section-kicker">THE BUCKET LIST</div><h2 id="list-title">值得期待的事</h2></div><p class="section-text">把每个念头，留给未来慢慢实现。</p></div>
      <div id="filters" class="filters" aria-label="筛选清单"></div>
      <div id="list" class="list" aria-live="polite"></div>
    </section>
  </main>
  <footer><div class="wrap footer-inner"><span>✿ &nbsp; 给生活多一点期待</span><a href="https://github.com/bass412/bucket-list/edit/main/items.json">在 GitHub 编辑清单 ↗</a></div></footer>
  <script>
    (() => {
      const list = document.getElementById('list');
      const filters = document.getElementById('filters');
      const ratio = document.getElementById('ratio');
      const done = document.getElementById('done');
      const progress = document.querySelector('.track');
      const bar = document.querySelector('.bar');
      let items = [];
      let selected = '全部';

      function addText(parent, tag, className, value) {
        const element = document.createElement(tag);
        element.className = className;
        element.textContent = value;
        parent.appendChild(element);
        return element;
      }
      function render() {
        const completed = items.filter(item => item.done === true).length;
        done.textContent = completed;
        ratio.textContent = completed + ' / ' + items.length;
        const percent = items.length ? Math.round(completed / items.length * 100) : 0;
        progress.setAttribute('aria-valuenow', percent);
        bar.style.width = percent + '%';
        const categories = [...new Set(items.map(item => item.category).filter(Boolean))];
        const labels = ['全部', '未完成', '已完成', ...categories];
        filters.replaceChildren();
        labels.forEach(label => {
          const button = addText(filters, 'button', 'filter', label);
          button.type = 'button';
          button.setAttribute('aria-pressed', String(selected === label));
          button.addEventListener('click', () => { selected = label; render(); });
        });
        const visible = items.filter(item => {
          if (selected === '全部') return true;
          if (selected === '已完成') return item.done === true;
          if (selected === '未完成') return item.done !== true;
          return item.category === selected;
        });
        list.replaceChildren();
        if (!visible.length) {
          const empty = addText(list, 'div', 'empty', '');
          addText(empty, 'div', 'empty-icon', '✿').setAttribute('aria-hidden', 'true');
          addText(empty, 'h3', '', items.length ? '这里暂时没有愿望' : '故事，正准备开始');
          addText(empty, 'p', '', items.length ? '换个分类看看吧。' : '想做的事情，会在这里慢慢出现。');
          return;
        }
        visible.forEach((item, index) => {
          const card = addText(list, 'article', 'card', '');
          const top = addText(card, 'div', 'card-top', '');
          addText(top, 'span', 'badge', item.category || '生活');
          addText(top, 'span', '', String(index + 1).padStart(2, '0'));
          addText(card, 'h3', '', item.title);
          addText(card, 'div', 'card-status' + (item.done === true ? ' done' : ''), item.done === true ? '✓ 已完成' : '○ 等待出发');
        });
      }
      fetch('./items.json').then(response => {
        if (!response.ok) throw new Error('读取失败');
        return response.json();
      }).then(data => {
        if (!Array.isArray(data) || data.some(item => !item || typeof item.title !== 'string' || !item.title.trim() || (item.category !== undefined && typeof item.category !== 'string') || (item.done !== undefined && typeof item.done !== 'boolean'))) throw new Error('格式不正确');
        items = data;
        render();
      }).catch(() => {
        const error = addText(list, 'div', 'error', '');
        addText(error, 'h3', '', '清单暂时无法显示');
        addText(error, 'p', '', '请检查 items.json 的格式，或稍后再试。');
      });
    })();
  </script>
</body>
</html>
